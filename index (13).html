<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ahorro para mi cumpleaños 🎉</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1>🎉 Mi Cumpleaños</h1>
    <p class="sub">Ahorra día a día para cada gasto</p>
  </header>

  <main>
    <section class="card summary">
      <div class="grid3">
        <div><span class="label">Presupuesto total</span><strong id="totalBudget">S/ 0.00</strong></div>
        <div><span class="label">Ahorrado</span><strong id="totalSaved" class="ok">S/ 0.00</strong></div>
        <div><span class="label">Falta</span><strong id="totalRemaining" class="warn">S/ 0.00</strong></div>
      </div>
      <div class="bar"><div id="totalBar" class="fill"></div></div>
      <p id="totalPct" class="small center">0% completado</p>

      <div class="row">
        <label>Fecha del cumpleaños
          <input type="date" id="eventDate">
        </label>
        <div id="suggest" class="suggest"></div>
      </div>
    </section>

    <section class="card">
      <h2>Agregar gasto</h2>
      <form id="addItemForm" class="inline">
        <input type="text" id="newName" placeholder="Ej: Hielo" required>
        <input type="number" id="newBudget" placeholder="Monto S/" min="0" step="0.01">
        <button type="submit">Agregar</button>
      </form>
    </section>

    <section id="items"></section>

    <section class="card">
      <h2>Respaldo</h2>
      <p class="small">Los datos se guardan en este navegador. Descarga un respaldo por si cambias de celular o borras datos.</p>
      <div class="inline">
        <button id="exportBtn" type="button" class="secondary">Exportar</button>
        <label class="btn secondary">Importar
          <input type="file" id="importFile" accept="application/json" hidden>
        </label>
        <button id="resetBtn" type="button" class="danger">Borrar todo</button>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
